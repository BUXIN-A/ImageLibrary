<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评论管理</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app-layout">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar"></header>
      <main class="container">
        <div class="page-head">
          <div>
            <h2>评论管理</h2>
            <div class="subtitle" id="comments-summary">审核与管理用户评论</div>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="refresh-btn">刷新</button>
        </div>

        <div class="toolbar">
          <span class="selected-count" id="selected-count">已选 0 条</span>
          <span class="spacer"></span>
          <button type="button" class="btn btn-outline btn-sm" id="batch-hide">批量隐藏</button>
          <button type="button" class="btn btn-outline btn-sm" id="batch-show">批量恢复</button>
          <button type="button" class="btn btn-danger btn-sm" id="batch-delete">批量删除</button>
        </div>

        <div class="toolbar">
          <div class="filter-bar">
            <div class="form-field grow">
              <label for="q-input">关键词</label>
              <input class="input" id="q-input" type="text" placeholder="搜索评论内容">
            </div>
            <div class="form-field">
              <label for="status-select">状态</label>
              <select class="select" id="status-select">
                <option value="">全部状态</option>
                <option value="visible">可见</option>
                <option value="hidden">已隐藏</option>
              </select>
            </div>
            <div class="form-field">
              <button type="button" class="btn btn-primary" id="filter-btn">筛选</button>
            </div>
            <div class="form-field">
              <button type="button" class="btn btn-ghost" id="reset-btn">重置</button>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th style="width:36px;"><input type="checkbox" id="select-all" aria-label="全选"></th>
                <th>评论内容</th>
                <th>用户</th>
                <th>所属图片</th>
                <th>时间</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="comments-tbody"></tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/comments.js"></script>
</body>
</html>
