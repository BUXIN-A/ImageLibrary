<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图库管理后台</title>
  <script>
    /* 尽早应用本地记忆主题，避免闪烁 */
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style>
    :root {
      --bg: #fbfbfa;
      --text: #37352f;
      --muted: #787774;
      --border: rgba(55, 53, 47, 0.09);
      --accent: #2383e2;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    :root[data-theme="dark"] {
      --bg: #191919;
      --text: #e9e9e7;
      --muted: #9b9b9b;
      --border: rgba(255, 255, 255, 0.094);
      --accent: #529cca;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }
    .boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--muted);
    }
    .boot__brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 600;
      font-size: 16px;
    }
    .boot__logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: var(--text);
      color: var(--bg);
    }
    .boot__spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="boot">
    <div class="boot__brand">
      <span class="boot__logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4-4 3 3 4-5 5 6"/>
        </svg>
      </span>
      <span>图库管理后台</span>
    </div>
    <div class="boot__spinner" aria-label="加载中"></div>
    <span>正在进入…</span>
  </div>

  <script>
    /* 根跳转：已登录进入仪表盘，未登录进入登录页（不依赖其它 JS 文件） */
    (function () {
      var token = null;
      try { token = localStorage.getItem("il_admin_token"); } catch (e) { /* ignore */ }
      location.replace(token ? "dashboard.html" : "login.html");
    })();
  </script>
</body>
</html>
