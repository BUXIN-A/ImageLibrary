<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录设置</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app-layout">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar"></header>
      <main class="container">
        <div class="page-head">
          <div>
            <h2>登录设置</h2>
            <div class="subtitle">配置前台用户登录方式：本地账号、GitHub 与自定义 OAuth2</div>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="refresh-btn">刷新</button>
        </div>

        <form id="login-form">
          <div class="card">
            <div class="card-header"><span>本地账号登录</span></div>
            <div class="card-body">
              <div class="form-field">
                <label>启用本地账号登录</label>
                <label class="switch">
                  <input type="checkbox" id="login-local-enabled">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><span>GitHub 登录</span></div>
            <div class="card-body">
              <div class="form-field">
                <label>启用 GitHub 登录</label>
                <label class="switch">
                  <input type="checkbox" id="login-github-enabled">
                  <span class="slider"></span>
                </label>
              </div>
              <div class="form-field">
                <label for="github-client-id">Client ID</label>
                <input class="input" id="github-client-id" type="text" autocomplete="off">
              </div>
              <div class="form-field">
                <label>Client Secret</label>
                <div class="flex items-center gap-sm flex-wrap">
                  <span class="badge badge-muted" id="github-secret-status">未设置</span>
                  <input class="input" id="github-secret-input" type="password" autocomplete="new-password"
                         placeholder="输入新密钥以更新" style="max-width:280px;">
                  <button type="button" class="btn btn-ghost btn-sm text-danger" id="github-secret-clear">清除密钥</button>
                </div>
                <div class="form-hint">出于安全考虑不显示明文；不填写则保持不变</div>
              </div>
              <div class="form-field">
                <label for="github-callback">回调地址</label>
                <div class="flex items-center gap-sm">
                  <input class="input" id="github-callback" type="text" readonly>
                  <button type="button" class="btn btn-outline btn-sm" data-copy="github-callback">复制</button>
                </div>
                <div class="form-hint">请将该地址配置到 GitHub OAuth App 的 Authorization callback URL</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><span>自定义 OAuth2 登录</span></div>
            <div class="card-body">
              <div class="form-field">
                <label>启用自定义 OAuth2 登录</label>
                <label class="switch">
                  <input type="checkbox" id="login-oauth2-enabled">
                  <span class="slider"></span>
                </label>
              </div>
              <div class="form-grid">
                <div class="form-field">
                  <label for="oauth2-client-id">Client ID</label>
                  <input class="input" id="oauth2-client-id" type="text" autocomplete="off">
                </div>
                <div class="form-field">
                  <label for="oauth2-scope">Scope</label>
                  <input class="input" id="oauth2-scope" type="text" autocomplete="off">
                </div>
                <div class="form-field full">
                  <label>Client Secret</label>
                  <div class="flex items-center gap-sm flex-wrap">
                    <span class="badge badge-muted" id="oauth2-secret-status">未设置</span>
                    <input class="input" id="oauth2-secret-input" type="password" autocomplete="new-password"
                           placeholder="输入新密钥以更新" style="max-width:280px;">
                    <button type="button" class="btn btn-ghost btn-sm text-danger" id="oauth2-secret-clear">清除密钥</button>
                  </div>
                  <div class="form-hint">出于安全考虑不显示明文；不填写则保持不变</div>
                </div>
                <div class="form-field full">
                  <label for="oauth2-authorize-url">授权地址（Authorize URL）</label>
                  <input class="input" id="oauth2-authorize-url" type="text" autocomplete="off">
                </div>
                <div class="form-field full">
                  <label for="oauth2-token-url">令牌地址（Token URL）</label>
                  <input class="input" id="oauth2-token-url" type="text" autocomplete="off">
                </div>
                <div class="form-field full">
                  <label for="oauth2-userinfo-url">用户信息地址（Userinfo URL）</label>
                  <input class="input" id="oauth2-userinfo-url" type="text" autocomplete="off">
                </div>
                <div class="form-field">
                  <label for="oauth2-user-id-field">用户 ID 字段</label>
                  <input class="input" id="oauth2-user-id-field" type="text" autocomplete="off">
                </div>
                <div class="form-field">
                  <label for="oauth2-username-field">用户名字段</label>
                  <input class="input" id="oauth2-username-field" type="text" autocomplete="off">
                </div>
                <div class="form-field">
                  <label for="oauth2-nickname-field">昵称字段</label>
                  <input class="input" id="oauth2-nickname-field" type="text" autocomplete="off">
                </div>
                <div class="form-field">
                  <label for="oauth2-email-field">邮箱字段</label>
                  <input class="input" id="oauth2-email-field" type="text" autocomplete="off">
                </div>
                <div class="form-field">
                  <label for="oauth2-avatar-field">头像字段</label>
                  <input class="input" id="oauth2-avatar-field" type="text" autocomplete="off">
                </div>
              </div>
              <div class="form-field">
                <label for="oauth2-callback">回调地址</label>
                <div class="flex items-center gap-sm">
                  <input class="input" id="oauth2-callback" type="text" readonly>
                  <button type="button" class="btn btn-outline btn-sm" data-copy="oauth2-callback">复制</button>
                </div>
                <div class="form-hint">请将该地址配置到第三方平台的回调地址（Redirect URI）</div>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-md">
            <button type="submit" class="btn btn-primary" id="login-save">保存设置</button>
          </div>
        </form>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/login-settings.js"></script>
</body>
</html>
