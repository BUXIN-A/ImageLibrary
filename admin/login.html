<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 图库管理后台</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    /* 尽早应用本地记忆主题，避免闪烁 */
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div class="login-page">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="login-brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4-4 3 3 4-5 5 6"/>
          </svg>
        </span>
        <h1>图库管理后台</h1>
        <p>请登录以继续</p>
      </div>

      <div id="login-error" class="alert alert-danger hidden" role="alert"></div>

      <div class="form-field">
        <label for="username">用户名</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
      <div class="login-footer">ImageLibrary · 管理后台</div>
    </form>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script>
    /* 登录页逻辑：回车提交、错误提示、成功后跳转仪表盘 */
    (function () {
      "use strict";
      var form = document.getElementById("login-form");
      var errorBox = document.getElementById("login-error");
      var submitBtn = document.getElementById("login-submit");
      var usernameInput = document.getElementById("username");
      var passwordInput = document.getElementById("password");

      Theme.init();
      Auth.redirectIfAuthed();
      usernameInput.focus();

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("hidden");
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorBox.classList.add("hidden");
        var username = usernameInput.value.trim();
        var password = passwordInput.value;
        if (!username || !password) {
          showError("请输入用户名和密码");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "登录中…";
        try {
          await Auth.login(username, password);
          location.href = "dashboard.html";
        } catch (err) {
          showError(err.message || "登录失败");
          submitBtn.disabled = false;
          submitBtn.textContent = "登录";
        }
      });
    })();
  </script>
</body>
</html>
