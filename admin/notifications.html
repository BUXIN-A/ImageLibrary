<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台通知</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app-layout">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar"></header>
      <main class="container">
        <div class="page-head">
          <div>
            <h2>后台通知</h2>
            <div class="subtitle" id="notif-summary">记录服务启动、站点地址、服务端错误、管理员登录与用户访问日志</div>
          </div>
          <div class="flex items-center gap-sm flex-wrap">
            <button type="button" class="btn btn-outline btn-sm" id="read-all-btn">全部标为已读</button>
            <button type="button" class="btn btn-outline btn-sm" id="clear-read-btn">清空已读</button>
            <button type="button" class="btn btn-danger btn-sm" id="clear-all-btn">清空全部</button>
            <button type="button" class="btn btn-outline btn-sm" id="refresh-btn">刷新</button>
          </div>
        </div>

        <div class="stat-grid mb-lg" id="notif-stats"></div>

        <div class="toolbar">
          <span class="selected-count" id="selected-count">已选 0 条</span>
          <span class="spacer"></span>
          <button type="button" class="btn btn-outline btn-sm" id="batch-read">批量标为已读</button>
          <button type="button" class="btn btn-danger btn-sm" id="batch-delete">批量删除</button>
        </div>

        <div class="toolbar">
          <div class="filter-bar">
            <div class="form-field">
              <label for="level-select">级别</label>
              <select class="select" id="level-select">
                <option value="">全部级别</option>
              </select>
            </div>
            <div class="form-field">
              <label for="category-select">分类</label>
              <select class="select" id="category-select">
                <option value="">全部分类</option>
              </select>
            </div>
            <div class="form-field grow">
              <label for="q-input">关键词</label>
              <input class="input" id="q-input" type="text" placeholder="搜索通知内容或详情">
            </div>
            <div class="form-field">
              <label class="checkbox" for="unread-only">
                <input type="checkbox" id="unread-only"><span>仅看未读</span>
              </label>
            </div>
            <div class="form-field">
              <button type="button" class="btn btn-primary" id="filter-btn">筛选</button>
            </div>
            <div class="form-field">
              <button type="button" class="btn btn-ghost" id="reset-btn">重置</button>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th style="width:36px;"><input type="checkbox" id="select-all" aria-label="全选"></th>
                <th style="width:70px;">级别</th>
                <th style="width:100px;">分类</th>
                <th>内容</th>
                <th style="width:130px;">来源 IP</th>
                <th style="width:150px;">时间</th>
                <th style="width:70px;">状态</th>
                <th style="width:150px;">操作</th>
              </tr>
            </thead>
            <tbody id="notif-tbody"></tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/notifications.js"></script>
</body>
</html>
