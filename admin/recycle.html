<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回收站</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app-layout">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar"></header>
      <main class="container">
        <div class="page-head">
          <div>
            <h2>回收站</h2>
            <div class="subtitle">已删除的图片可还原；彻底删除后不可恢复</div>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="refresh-btn">刷新</button>
        </div>

        <div class="toolbar">
          <label class="checkbox">
            <input type="checkbox" id="select-all">
            <span>全选本页</span>
          </label>
          <span class="selected-count" id="selected-count">已选 0 张</span>
          <span class="spacer"></span>
          <button type="button" class="btn btn-outline btn-sm" id="batch-restore">批量还原</button>
          <button type="button" class="btn btn-danger btn-sm" id="batch-purge">批量彻底删除</button>
        </div>

        <div id="recycle-list"></div>
        <div id="pagination"></div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/recycle.js"></script>
</body>
</html>
