<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号与安全</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app-layout">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar"></header>
      <main class="container">
        <div class="page-head">
          <div>
            <h2>账号与安全</h2>
            <div class="subtitle">修改管理员登录密码</div>
          </div>
        </div>

        <!-- 修改密码 -->
        <div class="card">
          <div class="card-header"><span>修改密码</span></div>
          <div class="card-body">
            <form id="password-form">
              <div class="form-field">
                <label for="old-password">原密码</label>
                <input class="input" id="old-password" type="password" autocomplete="current-password">
              </div>
              <div class="form-field">
                <label for="new-password">新密码</label>
                <input class="input" id="new-password" type="password" autocomplete="new-password">
              </div>
              <div class="form-field">
                <label for="confirm-password">确认新密码</label>
                <input class="input" id="confirm-password" type="password" autocomplete="new-password">
              </div>
              <button type="submit" class="btn btn-primary" id="password-submit">修改密码</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/settings.js"></script>
</body>
</html>
