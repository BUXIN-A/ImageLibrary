<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签管理</title>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("il_admin_theme");
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app-layout">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar"></header>
      <main class="container">
        <div class="page-head">
          <div>
            <h2>标签管理</h2>
            <div class="subtitle">标签用于图片归类与前台筛选</div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <form id="tag-form" class="flex gap-sm items-center flex-wrap">
              <input class="input" id="tag-name" type="text" placeholder="新建标签名称" style="max-width: 280px;">
              <button type="submit" class="btn btn-primary">新建标签</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span>全部标签</span>
            <span class="muted" id="tag-total"></span>
          </div>
          <div class="card-body">
            <div class="tag-list" id="tag-list">
              <div class="loading"><span class="spinner"></span>加载中…</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/tags.js"></script>
</body>
</html>
