# Alembic configuration.
# The database URL is not hard-coded here: migrations/env.py and
# backend/app/database.py build it from settings.DB_PATH (override with the
# DB_PATH environment variable).
[alembic]
# %(here)s is the directory of this file, independent of the current cwd
script_location = %(here)s/migrations
prepend_sys_path = .
# Leave empty; env.py derives the real URL from settings.DB_PATH
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
