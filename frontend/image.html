<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片详情 - 图片库</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('il_theme');
        if (t) { document.documentElement.setAttribute('data-theme', t); }
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <div id="detail" class="detail-wrap"></div>

    <section id="comments" class="comment-section" hidden>
      <h2 class="comment-section__title">评论</h2>
      <div id="comment-form-slot"></div>
      <div id="comment-list" class="comment-list"></div>
      <div id="comment-pagination" class="pagination"></div>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/user.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/image.js"></script>
</body>
</html>
