<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 - 图片库</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('il_theme');
        if (t) { document.documentElement.setAttribute('data-theme', t); }
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="themes/light.css">
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/ocean.css">
  <link rel="stylesheet" href="themes/forest.css">
  <link rel="stylesheet" href="themes/sunset.css">
  <link rel="stylesheet" href="themes/sakura.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <section class="page-head">
      <div>
        <h1 class="page-title">搜索</h1>
        <p class="page-subtitle">按关键词、标签或文件夹查找图片</p>
      </div>
    </section>

    <form id="search-form" class="filter-bar" role="search">
      <input id="q" class="input" type="search" placeholder="输入关键词（标题 / 描述 / 文件名）…" aria-label="关键词">
      <select id="tag" class="select" aria-label="标签">
        <option value="">全部标签</option>
      </select>
      <select id="folder" class="select" aria-label="文件夹">
        <option value="">全部文件夹</option>
      </select>
      <button class="btn btn--primary" type="submit">搜索</button>
      <button id="reset-btn" class="btn btn--ghost" type="button">重置</button>
    </form>

    <div id="result-count" class="result-count"></div>
    <div id="grid" class="image-grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <div id="app-footer"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/user.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/search.js"></script>
</body>
</html>
