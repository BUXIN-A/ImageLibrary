<!DOCTYPE html>
<html lang="zh-CN" data-theme-id="nav" data-preset="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 - 图片库</title>
  <link id="preset-style" rel="stylesheet" href="/presets/light.css?v=2.0.1">
  <script>
    (function () {
      var preset = 'light';
      try {
        var stored = localStorage.getItem('il_preset_nav');
        if (stored) preset = stored;
      } catch (e) { /* 忽略隐私模式等异常 */ }
      document.documentElement.setAttribute('data-preset', preset);
      var link = document.getElementById('preset-style');
      if (link) link.setAttribute('href', '/presets/' + encodeURIComponent(preset) + '.css?v=2.0.1');
    })();
  </script>
  <link rel="stylesheet" href="css/base.css?v=2.0.1">
  <link rel="stylesheet" href="css/layout.css?v=2.0.1">
  <link rel="stylesheet" href="css/components.css?v=2.0.1">
  <link rel="stylesheet" href="css/nav.css?v=2.0.1">
</head>
<body>
  <div id="app-header"></div>

  <main class="container container--narrow">
    <div class="auth-card card panel">
      <div class="auth-card__head">
        <h1 class="auth-card__title">登录 / 注册</h1>
        <p class="auth-card__subtitle muted">登录后即可发表评论、参与互动</p>
      </div>

      <div class="auth-tabs" id="auth-tabs" role="tablist">
        <button class="auth-tab is-active" id="tab-login" type="button" role="tab" aria-selected="true">登录</button>
        <button class="auth-tab" id="tab-register" type="button" role="tab" aria-selected="false">注册</button>
      </div>

      <div id="auth-message" class="alert alert--error hidden" role="alert"></div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label class="field">
          <span class="field__label">用户名</span>
          <input id="login-username" class="input" type="text" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field__label">密码</span>
          <input id="login-password" class="input" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-submit" class="btn btn--primary btn--block" type="submit">登录</button>
      </form>

      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <label class="field">
          <span class="field__label">用户名</span>
          <input id="register-username" class="input" type="text" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field__label">密码</span>
          <input id="register-password" class="input" type="password" autocomplete="new-password" required>
        </label>
        <label class="field">
          <span class="field__label">邮箱（可选）</span>
          <input id="register-email" class="input" type="email" autocomplete="email">
        </label>
        <button id="register-submit" class="btn btn--primary btn--block" type="submit">注册</button>
      </form>

      <div id="providers" class="auth-providers"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="toast-root"></div>

  <script defer src="js/config.js?v=2.0.1"></script>
  <script defer src="js/api.js?v=2.0.1"></script>
  <script defer src="js/user.js?v=2.0.1"></script>
  <script defer src="js/ui.js?v=2.0.1"></script>
  <script defer src="js/theme.js?v=2.0.1"></script>
  <script defer src="js/folder-access.js?v=2.0.1"></script>
  <script defer src="js/layout.js?v=2.0.1"></script>
  <script defer src="js/prefetch.js?v=2.0.1"></script>
  <script defer src="js/pages/login.js?v=2.0.1"></script>
</body>
</html>
