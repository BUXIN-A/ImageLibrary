<!DOCTYPE html>
<html lang="zh-CN" data-theme-id="nav" data-preset="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传 - 图片库</title>
  <link id="preset-style" rel="stylesheet" href="/presets/light.css?v=2.0.0">
  <script>
    (function () {
      var preset = 'light';
      try {
        var stored = localStorage.getItem('il_preset_nav');
        if (stored) preset = stored;
      } catch (e) { /* 忽略隐私模式等异常 */ }
      document.documentElement.setAttribute('data-preset', preset);
      var link = document.getElementById('preset-style');
      if (link) link.setAttribute('href', '/presets/' + encodeURIComponent(preset) + '.css?v=2.0.0');
    })();
  </script>
  <link rel="stylesheet" href="css/base.css?v=2.0.0">
  <link rel="stylesheet" href="css/layout.css?v=2.0.0">
  <link rel="stylesheet" href="css/components.css?v=2.0.0">
  <link rel="stylesheet" href="css/nav.css?v=2.0.0">
</head>
<body>
  <div id="app-header"></div>

  <main class="container container--narrow">
    <section class="page-head">
      <div>
        <h1 class="page-title">上传图片 / 视频</h1>
        <p class="page-subtitle">凭上传 Token 提交内容，管理员审核后公开</p>
      </div>
    </section>

    <div class="card panel">
      <label class="field" for="token">
        <span class="field__label">上传 Token</span>
      </label>
      <div class="field__row">
        <input id="token" class="input" type="text" placeholder="请输入管理员提供给你的上传 Token" autocomplete="off">
        <button id="validate-btn" class="btn btn--primary" type="button">校验</button>
      </div>
      <div id="token-result" class="token-result"></div>
    </div>

    <div class="card panel">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖拽图片或视频">
        <input id="file-input" type="file"
          accept="image/*,video/mp4,video/x-m4v,video/quicktime,video/webm,video/ogg,.jpg,.jpeg,.png,.gif,.webp,.bmp,.mp4,.m4v,.mov,.webm,.ogv"
          multiple hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p class="dropzone__title">点击选择或拖拽图片 / 视频到这里</p>
        <p id="upload-hint" class="muted">加载站点上传限制中…</p>
      </div>
      <ul id="file-list" class="file-list"></ul>
      <div id="upload-progress" class="upload-progress hidden">
        <div class="upload-progress__bar">
          <div id="upload-progress-fill" class="upload-progress__fill"></div>
        </div>
        <div id="upload-progress-text" class="upload-progress__text">准备上传…</div>
      </div>
      <div class="panel__actions">
        <button id="upload-btn" class="btn btn--primary" type="button" disabled>开始上传</button>
        <button id="clear-btn" class="btn btn--ghost" type="button">清空</button>
      </div>
    </div>

    <div id="upload-result" class="upload-result"></div>
  </main>

  <div id="app-footer"></div>
  <div id="toast-root"></div>

  <script defer src="js/config.js?v=2.0.0"></script>
  <script defer src="js/api.js?v=2.0.0"></script>
  <script defer src="js/user.js?v=2.0.0"></script>
  <script defer src="js/ui.js?v=2.0.0"></script>
  <script defer src="js/theme.js?v=2.0.0"></script>
  <script defer src="js/folder-access.js?v=2.0.0"></script>
  <script defer src="js/layout.js?v=2.0.0"></script>
  <script defer src="js/prefetch.js?v=2.0.0"></script>
  <script defer src="js/pages/upload.js?v=2.0.0"></script>
</body>
</html>
